<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Events — &lt;/KERNEL&gt;</title>
<meta name="description" content="Upcoming and past events from </KERNEL>, the Data Science Society of IISER Thiruvananthapuram." />
<style>
  body { margin: 0; background-color: #0e1117; color: #c9d1d9; }
  .page-loader { position: fixed; inset: 0; background: #0e1117; z-index: 9999; display: flex; align-items: center; justify-content: center; opacity: 1; transition: opacity 0.3s ease, visibility 0.3s ease; }
  .page-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
</style>
<link rel="preload" href="assets/logo.png" as="image" />
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
</head>
<body>
<div class="page-loader" id="page-loader">
  <div class="loader-inner">
    <img class="loader-mark" src="assets/logo.png" alt="&lt;/KERNEL&gt;" />
    <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    <p class="loader-text">solving NP-hard room booking schedules…</p>
  </div>
</div>

<header class="page-head">
  <div class="wrap">
    <div class="prompt-line"><span>$ select * from events;</span><span class="cursor"></span></div>
    <h1>Events</h1>
    <p class="lede">Workshops, hackathons, socials and outreach programs run by the society.</p>
  </div>
</header>

<main class="wrap">
  <section class="section">
    <div class="section-head">
      <h2><span class="idx">01.</span>Upcoming</h2>
    </div>
    <div class="grid" id="upcoming-events">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
  </section>

  <hr class="rule" />

  <section class="section">
    <div class="section-head">
      <h2><span class="idx">02.</span>Past</h2>
    </div>
    <div class="grid" id="past-events">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
  </section>
</main>

<script type="module" src="js/events.js"></script>
</body>
</html>
