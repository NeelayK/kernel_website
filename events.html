<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>&lt;/KERNEL&gt; — Data Science Society, IISER TVM</title>
<link rel="preload" href="./assets/logo.png" as="image" />
<link rel="preload" href="./assets/logo_light.png" as="image" />
<script>if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light-mode');</script><script>
  if (localStorage.getItem('theme') === 'light') {
    document.documentElement.classList.add('light-mode');
  }
</script>

<link rel="stylesheet" href="./css/style.css" />
<link rel="icon" type="image/png" href="./assets/favicon.png" />
</head>
<body>

<div class="page-loader" id="page-loader">
  <div class="loader-inner">
    
<img class="loader-mark" id="loader-img" src="./assets/logo.png" alt="</KERNEL>" width="220" height="51" />

<script>
      if (localStorage.getItem('theme') === 'light') {
        document.getElementById('loader-img').src = './assets/logo_light.png';
      }
    </script>
    <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    <p class="loader-text">initializing event grid…</p>
  </div>
</div>

<header class="page-head">
  <div class="wrap">
    <div class="prompt-line"><span>$ select * from events;</span><span class="cursor"></span></div>
<h1>Events</h1>
<p class="lede">
  From annual gatherings like the Frontiers Symposium in Data Science (FS-DSC) to hands-on workshops, poster sessions, hackathons, and community socials hosted by the data science community at IISER TVM.</p>
  </div>
</header>

<main class="wrap">
  <section class="section">
    <div class="section-head">
      <h2><span class="idx">01.</span>Upcoming</h2>
    </div>
    <div class="grid" id="upcoming-events">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
  </section>

  <hr class="rule" />

  <section class="section">
    <div class="section-head">
      <h2><span class="idx">02.</span>Past</h2>
    </div>
    <div class="grid" id="past-events">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
  </section>
</main>

<script type="module" src="./js/events.js"></script>
<script src="./js/boot-type.js"></script>
</body>
</html>
